<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Água Insights | Login</title>
  <link rel="stylesheet" href="style-login.css">
  <link rel="stylesheet" href="style-home.css">
</head>
<body>
  <header class="titulo">
    <h1 class="text-6xl my-4 nome">Água Insights</h1>
    <div class="linha-cabeçalho">
      <a href="home.html" class="text-xl footer">Home</a>
      <a href="noticias.html" class="text-xl footer">Notícias</a>
      <a href="contagem/index.html" class="text-xl footer">Game</a>
      <a href="login.html" class="text-xl footer">Faça login</a>
      <a href="cadastro.html" class="text-xl footer">Faça cadastro</a>
    </div>
  </header>

  <div class="rigth-login">
    <div class="card-login">
      <h1>Login</h1>
      <form id="form-login">
        <div class="textfield">
          <label for="email">Usuário (email)</label>
          <input type="text" id="email" name="usuario" placeholder="Digite seu email">
        </div> 
        <div class="textfield">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        </div>  
        <button type="submit" class="bt_login">Login</button> 
      </form>
    </div>    
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', function(event) {
      event.preventDefault();

      const email = document.getElementById('email');
      const senha = document.getElementById('senha');

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const senhaRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]).{8,}$/;

      if (!emailRegex.test(email.value)) {
        alert('Por favor, insira um email válido.');
        return;
      }

      if (!senhaRegex.test(senha.value)) {
        alert('A senha deve conter no mínimo 8 caracteres, com letras maiúsculas, minúsculas, número e símbolo.');
        return;
      }

      // Salvar email no localStorage
      localStorage.setItem('usuarioLogado', email.value);

      // Redirecionar para a home
      window.location.href = 'home.html';
    });
  </script>
</body>
</html>
